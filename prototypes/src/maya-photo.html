);overflow:hidden}#maya-unfold .maya{width:100%;height:84px;display:flex;align-items:center;gap:14px;padding:16px 23px;transition:height var(--duration)}#maya-unfold .avatar{width:42px;height:42px;border-radius:50%;background:var(--active);color:var(--active-ink);display:grid;place-items:center;flex-shrink:0}#maya-unfold .name{font-weight:500}#maya-unfold .preview{display:block;color:var(--secondary);font-size:13px}#maya-unfold .thread{padding:0 22px 22px;opacity:0;transform:translateY(12px);transition:opacity 180ms,transform var(--duration)}#maya-unfold .message{border-left:2px solid var(--active);padding:0 0 0 15px;margin:10px 0 30px}#maya-unfold .message p{margin:5px 0 0;font-size:18px}#maya-unfold .timestamp{font-size:12px;color:var(--secondary)}#maya-unfold label{display:block;font-size:13px;color:var(--secondary);margin-bottom:8px}#maya-unfold textarea{font:inherit;width:100%;height:105px;border:1px solid var(--edge);border-radius:14px;background:var(--paper);color:var(--ink);padding:12px;resize:vertical}#maya-unfold .compose-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px}#maya-unfold .send{background:var(--active);color:var(--active-ink);border-radius:30px;padding:10px 20px}#maya-unfold .send:disabled{opacity:.4}#maya-unfold .draft-status{font-size:12px;color:var(--secondary)}#maya-unfold .bottom{position:absolute;bottom:25px;left:24px;right:24px;display:flex;justify-content:space-between;border-top:1px solid var(--edge);padding-top:15px}#maya-unfold .close{display:none}#maya-unfold .device.open .mantle{top:119px;left:24px;height:408px;border-radius:22px 54px 30px 38px}#maya-unfold .device.open .maya{height:83px}#maya-unfold .device.open .thread{opacity:1;transform:translateY(0);transition-delay:170ms}#maya-unfold .device.open .connections{opacity:0;transform:translateY(30px);pointer-events:none}#maya-unfold .device.open .stem{height:335px;opacity:.35}#maya-unfold .device.open .close{display:block}#maya-unfold .device.open .rest-label{display:none}#maya-unfold .sent{margin:12px 0;font-size:14px;overflow-wrap:anywhere}#maya-unfold .home-draft{font-size:12px;color:var(--secondary);display:none}#maya-unfold .device.has-draft .home-draft{display:block}#maya-unfold .connections button:disabled{opacity:.85}#maya-unfold .bottom .plain{color:var(--secondary);font-size:13px}#maya-unfold .device.reduced *{transition-duration:0ms!important;transition-delay:0ms!important}@media(prefers-reduced-motion:reduce){#maya-unfold .device *{transition-duration:0ms!important;transition-delay:0ms!important}}@media(max-width:360px){#maya-unfold .device{padding:20px 18px}#maya-unfold .mantle{left:32px;right:18px}#maya-unfold .device.open .mantle{left:18px}#maya-unfold .thread{padding:0 16px 20px}}

<section class="device" aria-label="SimpleX continuous conversation concept">
<div class="header"><span class="wordmark">SimpleX</span><span class="mode">Interaction study</span></div>
<h3 class="rest-label">Your people.</h3><button type="button" class="close cursor-interaction">← Your people</button>
<div class="stem" aria-hidden="true"></div>
<div class="connections"><button type="button" disabled>Family<small>All quiet</small></button><button type="button" disabled>Studio<small>New photograph</small></button><span class="home-draft">Draft kept in Maya’s conversation</span></div>
<div class="mantle"><button type="button" class="maya cursor-interaction" aria-expanded="false"><span class="avatar" aria-hidden="true">M</span><span><span class="name">Maya</span><span class="preview">Shall we go on Saturday?</span></span></button><div class="thread" hidden><div class="message"><span class="timestamp">Maya · 10:24</span><p>Shall we go on Saturday?</p></div><div class="sent" hidden></div><label for="maya-draft">Write to Maya</label><textarea id="maya-draft" placeholder="Your reply…"></textarea><div class="compose-bottom"><span class="draft-status">Only Maya</span><button type="button" class="send cursor-interaction" disabled>Send</button></div></div></div>
<div class="bottom"><span class="plain">Private conversation</span><span class="plain">Local demo</span></div><span class="sr-only" aria-live="polite" id="maya-announcement"></span>
</section>
<script>
(()=>{const root=document.getElementById('maya-unfold'),device=root.querySelector('.device'),maya=root.querySelector('.maya'),close=root.querySelector('.close'),thread=root.querySelector('.thread'),input=root.querySelector('textarea'),send=root.querySelector('.send'),status=root.querySelector('.draft-status'),sent=root.querySelector('.sent'),announcement=root.querySelector('#maya-announcement');const settings={duration:430,reduced:false};let state={open:false,draft:'',sent:''};let closing;
function restore(snapshot){if(snapshot?.privateContent?.concept==='maya-unfold'){state={...state,...snapshot.privateContent};input.value=state.draft||'';}render();}
function render(){device.style.setProperty('--duration',settings.duration+'ms');device.classList.toggle('reduced',settings.reduced);device.classList.toggle('open',state.open);device.classList.toggle('has-draft',!!state.draft);maya.setAttribute('aria-expanded',String(state.open));root.querySelector('.connections').inert=state.open;send.disabled=!state.draft.trim();status.textContent=state.draft?'Draft kept · only Maya':'Only Maya';sent.hidden=!state.sent;sent.textContent=state.sent?'You · '+state.sent+' — simulated send':'';if(state.open){clearTimeout(closing);thread.hidden=false;thread.inert=false;}else{thread.inert=true;closing=setTimeout(()=>{if(!state.open)thread.hidden=true;},settings.reduced?0:settings.duration);}}
function save(){window.openai?.setWidgetState?.({modelContent:{concept:'Continuous Maya interaction',stage:state.open?'conversation':'home',draftPreserved:!!state.draft,simulatedSend:!!state.sent},privateContent:{concept:'maya-unfold',...state}})?.catch(()=>{});}
maya.addEventListener('click',()=>{if(state.open)return;thread.hidden=false;requestAnimationFrame(()=>{state.open=true;render();save();announcement.textContent='Maya’s conversation expanded.';});});close.addEventListener('click',()=>{state.open=false;render();save();maya.focus();announcement.textContent=state.draft?'Returned home. Your draft is preserved.':'Returned home.';});input.addEventListener('input',()=>{state.draft=input.value;render();save();});send.addEventListener('click',()=>{if(!state.draft.trim())return;state.sent=state.draft.trim();state.draft='';input.value='';render();save();announcement.textContent='Message sent in this local simulation.';});root.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.open)close.click();});restore(window.openai?.widgetState);window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});if(globalThis.Tweak){const t=new Tweak({container:device,onChange:render});t.addSlider(settings,'duration',{label:'Unfold duration',min:180,max:650,step:10,unit:'ms'});t.addToggle(settings,'reduced',{label:'Reduced motion'});}
})();
</script>
<style>
#maya-unfold .tool-area{margin-top:14px}#maya-unfold .tool-fan{display:flex;gap:8px;align-items:center;padding:6px 0}#maya-unfold .tool-fan button{background:var(--paper);border-radius:35px 35px 12px 35px}#maya-unfold .photo-pane{margin-top:12px}#maya-unfold .photo-preview{display:block;width:100%;max-height:230px;object-fit:contain;border-radius:25px 12px 30px 10px;background:var(--paper)}#maya-unfold .photo-target{width:100%;padding:0;position:relative;display:block;overflow:hidden;border-radius:25px 12px 30px 10px}#maya-unfold .photo-target .pin{position:absolute;transform:translate(-50%,-50%);background:var(--active);color:var(--active-ink);border:2px solid var(--paper);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-size:12px}#maya-unfold .photo-actions{display:flex;gap:8px;justify-content:space-between;margin-top:8px}#maya-unfold .photo-actions .primary-photo{border-radius:30px;background:var(--active);color:var(--active-ink)}#maya-unfold .photo-note{font-size:13px;color:var(--secondary);margin:8px 0}#maya-unfold .photo-file{width:100%;font:inherit;font-size:13px;margin:5px 0 10px}#maya-unfold .annotation-input{width:100%;font:inherit;font-size:16px;padding:12px;border:1px solid var(--edge);border-radius:12px;background:var(--paper);color:var(--ink)}#maya-unfold .device.open.tools-open .mantle{height:505px}#maya-unfold .device.open.tools-open{min-height:720px}#maya-unfold .device.open.photo-open .mantle{height:790px}#maya-unfold .device.open.photo-open{min-height:1000px}#maya-unfold .reply-output{font-size:14px;overflow-wrap:anywhere}#maya-unfold .photo-target:disabled{opacity:1}
</style>
<div class="tool-area" id="maya-photo-tools"><button type="button" class="tools-toggle cursor-interaction" aria-expanded="false">＋ Tools</button><div class="tool-fan" hidden><button type="button" class="choose-photo cursor-interaction">Photo</button><button type="button" class="return-write cursor-interaction">Write</button></div><div class="photo-pane" hidden><label for="maya-photo-file">Choose a photo · stays in this local demo</label><input id="maya-photo-file" class="photo-file" type="file" accept="image/png,image/jpeg,image/webp"><p class="photo-note" role="status">Review before sending to Maya.</p><button type="button" class="photo-target cursor-interaction" disabled aria-label="Place a reply point on the photo"><img class="photo-preview" alt="Your selected photo" hidden><span class="pin" hidden>1</span></button><div class="photo-actions"><button type="button" class="cancel-photo cursor-interaction">Close photo</button><button type="button" class="primary-photo cursor-interaction" disabled>Send photo</button></div><div class="annotation" hidden><label for="maya-photo-reply">Reply at this point · only Maya</label><input id="maya-photo-reply" class="annotation-input" placeholder="What would you like to say?"><button type="button" class="send-reply cursor-interaction" disabled>Send reply</button><p class="reply-output" hidden></p></div></div></div>
<script>
(()=>{const r=document.getElementById('maya-unfold'),d=r.querySelector('.device'),tools=r.querySelector('#maya-photo-tools');r.querySelector('.thread').append(tools);const toggle=tools.querySelector('.tools-toggle'),fan=tools.querySelector('.tool-fan'),pane=tools.querySelector('.photo-pane'),file=tools.querySelector('input[type=file]'),img=tools.querySelector('img'),target=tools.querySelector('.photo-target'),primary=tools.querySelector('.primary-photo'),note=tools.querySelector('.photo-note'),pin=tools.querySelector('.pin'),annotation=tools.querySelector('.annotation'),reply=tools.querySelector('.annotation-input'),sendReply=tools.querySelector('.send-reply'),output=tools.querySelector('.reply-output');let photoSent=false,point=null,readVersion=0;
function remember(){window.openai?.setWidgetState?.({modelContent:{concept:'Continuous Maya photo interaction',stage:photoSent?'shared-image':pane.hidden?'conversation':'photo-preview',photoSendSimulated:photoSent,replyPoint:point,replySent:!output.hidden},privateContent:{concept:'maya-photo',draft:r.querySelector('textarea').value}})?.catch(()=>{});}
function toolsOpen(on){fan.hidden=!on;toggle.setAttribute('aria-expanded',String(on));d.classList.toggle('tools-open',on);}
toggle.addEventListener('click',()=>toolsOpen(fan.hidden));tools.querySelector('.choose-photo').addEventListener('click',()=>{pane.hidden=false;d.classList.add('photo-open');toolsOpen(true);});function hidePhoto(){pane.hidden=true;d.classList.remove('photo-open');}tools.querySelector('.return-write').addEventListener('click',()=>{hidePhoto();toolsOpen(false);r.querySelector('textarea').focus();});tools.querySelector('.cancel-photo').addEventListener('click',hidePhoto);
file.addEventListener('change',()=>{const f=file.files?.[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)){note.textContent='Choose a PNG, JPEG or WebP image.';return;}const version=++readVersion;const reader=new FileReader();reader.onload=()=>{if(version!==readVersion)return;img.src=String(reader.result);img.hidden=false;photoSent=false;primary.disabled=false;primary.textContent='Send photo';target.disabled=true;annotation.hidden=true;pin.hidden=true;output.hidden=true;point=null;note.textContent='Preview · only Maya · not sent';};reader.onerror=()=>{note.textContent='The image could not be opened. Choose another.';};reader.readAsDataURL(f);});primary.addEventListener('click',()=>{if(img.hidden)return;photoSent=true;target.disabled=false;primary.disabled=true;primary.textContent='Sent in demo';note.textContent='Shared image · tap a point to reply';remember();});target.addEventListener('click',e=>{if(!photoSent)return;const box=target.getBoundingClientRect();const keyboard=e.detail===0;point={x:keyboard?.5:Math.max(0,Math.min(1,(e.clientX-box.left)/box.width)),y:keyboard?.5:Math.max(0,Math.min(1,(e.clientY-box.top)/box.height))};pin.style.left=point.x*100+'%';pin.style.top=point.y*100+'%';pin.hidden=false;annotation.hidden=false;reply.focus();remember();});reply.addEventListener('input',()=>{sendReply.disabled=!reply.value.trim();});sendReply.addEventListener('click',()=>{if(!reply.value.trim()||!point)return;output.textContent='You · '+reply.value.trim()+' — simulated reply at point 1';output.hidden=false;reply.value='';sendReply.disabled=true;remember();});})();
</script>

<script>
(()=>{const root=document.getElementById('maya-unfold'),device=root.querySelector('.device'),thread=root.querySelector('.thread');function fit(){if(device.classList.contains('open'))device.style.setProperty('--expanded-height',Math.max(408,thread.scrollHeight+105)+'px');}new ResizeObserver(fit).observe(thread);new MutationObserver(fit).observe(thread,{subtree:true,childList:true,attributes:true});new MutationObserver(fit).observe(device,{attributes:true,attributeFilter:['class']});fit();})();
