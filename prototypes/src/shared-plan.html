<div id="shared-messaging" class="viz-dotted-background">
<style>
#shared-messaging{padding:20px 8px;font-family:Inter,system-ui,sans-serif;color-scheme:light dark}#shared-messaging .phone{--paper:light-dark(#fafbf9,#171c1b);--ink:light-dark(#192c29,#e7efeb);--soft:light-dark(#edf1ee,#25312e);--line:light-dark(#d9e2dd,#3c4b45);--dim:light-dark(#586e65,#b1c3ba);--tone:light-dark(#275d50,#a1d7c4);background:var(--paper);color:var(--ink);max-width:390px;margin:auto;border:1px solid var(--line);border-radius:32px;padding:22px;box-sizing:border-box;min-height:650px;display:flex;flex-direction:column}#shared-messaging *{box-sizing:border-box}#shared-messaging button{font:inherit;color:inherit;min-height:44px;border:0;background:transparent;border-radius:12px;padding:10px 12px;text-align:left}#shared-messaging button:hover{background:var(--soft)}#shared-messaging .bar{display:flex;justify-content:space-between;align-items:center;gap:8px}#shared-messaging .small{font-size:12px;color:var(--dim);line-height:1.5}#shared-messaging h2{font-size:25px;font-weight:500;letter-spacing:-.7px;margin:12px 0 8px}#shared-messaging h3{font-size:20px;font-weight:500;margin:4px 0 14px}#shared-messaging p{font-size:14px;line-height:1.6;margin:8px 0}#shared-messaging .rule{border-top:1px solid var(--line);margin:18px 0}#shared-messaging .space{padding:18px 0}#shared-messaging .primary{background:var(--ink);color:var(--paper);text-align:center;width:100%;margin-top:14px}#shared-messaging .primary:hover{background:var(--tone);color:var(--paper)}#shared-messaging .object{border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0;background:var(--paper)}#shared-messaging .message{padding:12px 16px;background:var(--soft);border-radius:4px 16px 16px 16px;margin:10px 30px 10px 0;font-size:15px;line-height:1.5}#shared-messaging .mine{margin:10px 0 10px 35px;border-radius:16px 4px 16px 16px}#shared-messaging .tag{font-size:12px;color:var(--tone);display:inline-block;margin-bottom:10px}#shared-messaging .row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0;border-bottom:1px solid var(--line);border-radius:0}#shared-messaging .row span{display:block}#shared-messaging .footer{margin-top:auto;padding-top:20px}#shared-messaging .bottom{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px}#shared-messaging .status{font-size:12px;color:var(--dim);min-height:20px;margin:12px 0;text-align:center}#shared-messaging .plan-date{font-size:40px;letter-spacing:-2px;font-weight:400;margin:8px 0}#shared-messaging label{display:flex;gap:12px;align-items:start;font-size:14px;line-height:1.5;padding:12px 0}#shared-messaging input{margin-top:4px;accent-color:var(--tone)}#shared-messaging details{font-size:13px;line-height:1.6;margin:15px 0}#shared-messaging summary{min-height:44px;padding:12px 0}#shared-messaging .transition{animation:unfold .25s ease-out}@keyframes unfold{from{transform:translateY(8px);opacity:.5}to{transform:translateY(0);opacity:1}}@media(prefers-reduced-motion:reduce){#shared-messaging .transition{animation:none}}
</style>
<div class="phone" aria-label="Messaging interaction prototype"><div class="bar"><span class="small">18:12</span><span class="small">Interactive concept · Nothing is sent</span></div><main id="messaging-stage"></main><div class="footer"><div id="messaging-status" class="status" aria-live="polite"></div><div class="bottom"><button data-action="home" class="cursor-interaction">Overview</button><button data-action="restart" class="cursor-interaction">Restart demo</button></div></div></div>
<script>
(()=>{const root=document.getElementById('shared-messaging'),stage=root.querySelector('#messaging-stage'),status=root.querySelector('#messaging-status');let s={view:'home',confirmed:false,shared:false,venue:false,later:false};const saved=window.openai?.widgetState?.privateContent;if(saved&&typeof saved==='object'&&['home','chat','suggestion','plan','share','alex','later'].includes(saved.view))s={...s,...saved};
const button=(action,text,primary=false)=>`<button class="${primary?'primary ':''}cursor-interaction" data-action="${action}">${text}</button>`;
function persist(){window.openai?.setWidgetState?.({modelContent:{concept:'Shared messaging',stage:s.view,planConfirmed:s.confirmed,sharedWithAlex:s.shared,venueAgreed:s.venue,reminderSet:s.later},privateContent:s})?.catch(()=>{});}
function render(){let html='';if(s.view==='home'){html=`<h2>Your conversations</h2><p class="small">People and the things you share.</p><div class="space">${s.confirmed?`<button class="row cursor-interaction" data-action="plan"><span>Thursday dinner<span class="small">${s.venue?'Olive · 7pm':'7pm · Place undecided'}${s.later?' · Returns tomorrow':''}</span></span><span>↗</span></button>`:''}<button class="row cursor-interaction" data-action="chat"><span>Maya<span class="small">After seven works for me.</span></span><span class="small">New</span></button>${s.shared?`<button class="row cursor-interaction" data-action="alex"><span>Alex<span class="small">A suggestion for Thursday dinner</span></span><span>↗</span></button>`:''}</div><div class="object"><span class="tag">Start here</span><p>Open Maya’s conversation to turn a few messages into an agreed plan.</p>${button('chat','Open Maya →',true)}</div>`;}
if(s.view==='chat'){html=`<div class="bar"><h2>Maya</h2><span class="small">Private · You + Maya</span></div><div class="space"><span class="small">You · 18:10</span><div class="message mine">Dinner Thursday?</div><span class="small">Maya · 18:12</span><div class="message">After seven works for me.</div></div>${s.confirmed?`<div class="object"><span class="tag">Agreed by you and Maya</span><h3>Thursday dinner</h3><p>7pm · ${s.venue?'Olive':'Place undecided'}</p>${button('plan','Open shared plan →',true)}</div>`:`<div class="object"><span class="tag">Suggested from this exchange</span><h3>A plan is taking shape.</h3><p>Thursday · After 7pm</p><p class="small">A suggestion becomes shared only after you confirm it.</p>${button('suggestion','Review suggestion →',true)}</div>`}`;}
if(s.view==='suggestion'){html=`<h2>Make it a plan</h2><span class="tag">System suggestion · Not yet agreed</span><div class="object"><h3>Thursday dinner</h3><div class="plan-date">7pm</div><p>Proposed exact time</p><p class="small">Maya said “after seven”. Confirm the time together.</p><div class="rule"></div><p>Place <span class="small">Still to decide</span></p></div><details><summary>See the source messages</summary>You: “Dinner Thursday?”<br>Maya: “After seven works for me.”</details>${button('confirm','Confirm 7pm with Maya',true)}<p class="small">Demo continues with Maya accepting 7pm.</p>`;}
if(s.view==='plan'){html=`<div class="bar"><h2>Thursday dinner</h2><span class="small">Shared plan</span></div><span class="tag">Agreed · You + Maya${s.shared?' + Alex':''}</span><div class="object"><div class="plan-date">7pm</div><p>Thursday · ${s.venue?'Olive':'Place undecided'}</p><div class="rule"></div><p class="small">${s.venue?'Alex proposed Olive. You accepted it in this demo.':'The time is agreed. The place is still open.'}</p></div>${button(s.shared?'alex':'share',s.shared?'See Alex’s suggestion →':'Invite Alex to this plan →',true)}${button('later',s.later?'Reminder: tomorrow at 9am':'Bring this back tomorrow')}<details><summary>Who changed what?</summary>You proposed Thursday.<br>Maya said after seven.<br>You proposed 7pm. Maya accepted (simulated).${s.shared?'<br>You shared the plan with Alex.':''}${s.venue?'<br>Alex suggested Olive. You accepted (simulated).':''}</details>${button('chat','View private chat with Maya')}`;}
if(s.view==='share'){html=`<h2>Invite Alex</h2><p>Choose what travels with the invitation.</p><div class="object"><span class="tag">Alex will see</span><h3>Thursday dinner</h3><p>Thursday · 7pm<br>Place undecided</p><p class="small">Participants: You, Maya and Alex</p></div><label><input type="checkbox" checked disabled><span>Share the plan and future plan discussion</span></label><div class="rule"></div><p class="small">Your private messages with Maya stay in your private conversation.</p>${button('share-confirm','Share plan with Alex',true)}${button('plan','Cancel')}`;}
if(s.view==='alex'){html=`<h2>Thursday dinner</h2><span class="tag">Plan discussion · You + Maya + Alex</span><div class="space"><span class="small">Alex · Just now</span><div class="message">How about Olive? It’s near the station.</div></div><div class="object"><span class="tag">${s.venue?'Agreed in this demo':'Alex’s suggestion · Awaiting a decision'}</span><h3>Olive</h3><p>Thursday · 7pm</p>${s.venue?button('plan','Return to plan →',true):button('venue','Agree on Olive',true)}</div><p class="small">Alex can see the shared plan and its discussion. The original private chat is separate.</p>`;}
if(s.view==='later'){html=`<h2>Let it recede</h2><p>Keep the plan available without keeping it in your attention.</p><div class="object"><span class="tag">Thursday dinner</span><h3>Tomorrow at 9am</h3><p class="small">A reminder will bring this plan forward. This prototype schedules nothing outside the demo.</p></div>${button('schedule','Set demo reminder',true)}${button('plan','Keep it here')}`;}
stage.innerHTML=`<div class="transition">${html}</div>`;}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;status.textContent='';if(a==='restart'){s={view:'home',confirmed:false,shared:false,venue:false,later:false};}else if(a==='confirm'){s.confirmed=true;s.view='plan';status.textContent='You and Maya agreed on 7pm · Simulated';}else if(a==='share-confirm'){s.shared=true;s.view='alex';status.textContent='Only the plan was shared · Simulated';}else if(a==='venue'){s.venue=true;s.view='plan';status.textContent='Place updated to Olive · Simulated';}else if(a==='schedule'){s.later=true;s.view='home';status.textContent='Plan returns tomorrow at 9am · Simulated';}else{s.view=a;}render();persist();});window.addEventListener('openai:set_globals',e=>{const n=e.detail?.globals?.widgetState?.privateContent;if(n&&['home','chat','suggestion','plan','share','alex','later'].includes(n.view)){s={...s,...n};render();}});render();})();
</script>
</div>
