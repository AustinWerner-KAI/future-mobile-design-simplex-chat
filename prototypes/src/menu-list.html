<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One list, many conversations — From anatomy to interface</title><style>
:root{color-scheme:light dark;--paper:light-dark(#f6f4ec,#162520);--ink:light-dark(#153c34,#e6eee8);--muted:light-dark(#4f655c,#b6c8bf);--surface:light-dark(#e7ecdf,#273e33);--line:light-dark(#c3cdc0,#557362);--accent:light-dark(#185b4b,#b3dbc1);--onaccent:light-dark(#fff,#133b2b)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 system-ui,sans-serif}a{color:inherit}.intro{max-width:430px;margin:20px auto;padding:0 24px;font-size:12px;color:var(--muted)}.phone{max-width:430px;margin:24px auto;background:var(--paper);padding:28px 24px;border:1px solid var(--line);border-radius:32px;min-height:780px}header{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}.brand{font-size:17px;color:var(--ink);font-weight:600}h1{font-size:36px;font-weight:450;letter-spacing:-.05em;line-height:1.1;margin:36px 0 12px}.lede{font-size:13px;color:var(--muted);margin-bottom:26px}.search{display:flex;align-items:center;border-bottom:1px solid var(--line);margin-bottom:18px;padding-bottom:12px;gap:12px}.search input{width:100%;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:10px 0}.search label{font-size:12px;color:var(--muted)}button{font:inherit;color:inherit;cursor:pointer;min-height:44px}button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.filters{display:flex;gap:8px;margin-bottom:12px}.filters button{border:0;border-radius:24px;padding:8px 16px;background:transparent;font-size:13px;color:var(--muted)}.filters button[aria-pressed=true]{background:var(--surface);color:var(--ink)}.conversation{position:relative;border-bottom:1px solid var(--line);padding:9px 0;transition:background .3s,border-radius .3s}.row{display:flex;gap:12px;align-items:flex-start;width:100%;border:0;background:transparent;text-align:left;padding:13px 0}.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink);font-size:13px}.copy{min-width:0;flex:1}.name-line{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.name{font-size:16px;font-weight:550}.time{font-size:10px;color:var(--muted);white-space:nowrap}.snippet{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.preview-two{display:block;font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.count{display:inline-flex;min-width:18px;height:18px;justify-content:center;align-items:center;border-radius:50%;background:var(--accent);color:var(--onaccent);font-size:10px;margin-left:8px}.channel{display:block;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}.conversation.open{background:var(--surface);border:0;border-radius:12px 32px 24px 24px;margin:8px -12px;padding:9px 12px}.conversation.open .avatar{background:var(--accent);color:var(--onaccent)}.conversation.open .snippet,.conversation.open .preview-two{display:none}.workspace{padding:4px 0 12px 52px}.messages{border-left:1px solid var(--line);padding-left:14px}.message{margin:0 0 18px;font-size:14px;overflow-wrap:anywhere}.message small{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}.audience{font-size:11px;color:var(--muted);margin:20px 0 8px}.workspace textarea{display:block;width:100%;height:76px;resize:none;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:14px}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px}.send{border:0;border-radius:25px;background:var(--accent);color:var(--onaccent);padding:8px 18px;font-size:13px}.send:disabled{opacity:.45;cursor:default}.close{background:transparent;border:0;padding:0;font-size:12px;color:var(--muted)}.draft{font-size:10px;color:var(--muted);margin:8px 0 0}.empty{padding:28px 0;color:var(--muted)}footer{display:flex;justify-content:space-between;align-items:center;padding-top:24px;font-size:10px;color:var(--muted)}select{font:inherit;background:transparent;color:inherit;border:1px solid var(--line);padding:8px;border-radius:12px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}@media(max-width:460px){.intro{margin:14px auto}.phone{margin:0;border:0;border-radius:0;max-width:none;padding:24px 20px}.workspace{padding-left:0}.messages{margin-left:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
h1,.name{overflow-wrap:anywhere}.filters,.name-line,footer{flex-wrap:wrap}footer{gap:12px}select{min-height:44px}header{gap:12px}
.messages{max-height:190px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}.retained-draft{display:block;font-size:11px;color:var(--accent);margin-top:6px}.workspace{animation:unfold 280ms ease-out}@keyframes unfold{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.workspace{animation:none}}
</style></head><body><div class="intro"><a href="../index.html#prototype">← From anatomy to interface</a><p>Menu study · fictional messages · local simulated sending.</p></div><main class="phone"><header><span class="brand">SimpleX</span><span>MENU STUDY / 2028</span></header><h1>Your conversations.</h1><p class="lede">One list. The people, messages and context you need.</p><div class="search"><label for="find">Find</label><input id="find" type="search" placeholder="People or messages" autocomplete="off"></div><nav class="filters" aria-label="Conversation filters"><button type="button" data-filter="all" aria-pressed="true">All</button><button type="button" data-filter="unread" aria-pressed="false">Unread</button><button type="button" data-filter="groups" aria-pressed="false">Groups</button></nav><section id="list" aria-label="Conversations"></section><p class="empty" hidden>No conversations match. Try another name or message.</p><footer><span>Local study · drafts stay in this tab</span><label>Appearance <select id="appearance"><option value="light dark">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label></footer><span class="sr-only" role="status" id="status"></span></main><script>
(()=>{const data=[
{id:'maya',name:'Maya',initial:'M',time:'Now',unread:2,channel:'Private chat',messages:[['Maya','10:24','Shall we go on Saturday?'],['Maya','10:25','I found a place near the coast.']]},
{id:'family',name:'Family',initial:'F',time:'12 min',unread:3,group:true,channel:'Group · 4 people',messages:[['Dad','10:11','Lunch at ours on Sunday?'],['Sam','10:13','Yes! I’ll bring something.'],['Mum','10:14','See you all at one.']]},
{id:'studio',name:'Studio',initial:'S',time:'28 min',unread:1,group:true,channel:'Group · 3 people',messages:[['Alex','09:55','The new sketches are ready.'],['Robin','09:58','Let’s look at the opening transition.']]},
{id:'nora',name:'Nora',initial:'N',time:'1 hour',unread:0,channel:'Email · external channel',email:true,messages:[['Nora','09:08','Weekend at the coast'],['Nora','09:08','Shall I send you the details?']]},
{id:'alex',name:'Alex',initial:'A',time:'2 hours',unread:0,channel:'Private chat',messages:[['You','08:10','How did the presentation go?'],['Alex','08:13','Really well. Thank you for the notes.']]},
{id:'garden',name:'Garden',initial:'G',time:'Yesterday',unread:0,group:true,channel:'Group · 6 people',messages:[['Jo','Yesterday','The first tomatoes are ready.'],['Lee','Yesterday','I’ll be there after work.']]},
{id:'jules',name:'Jules',initial:'J',time:'Yesterday',unread:0,channel:'Private chat',messages:[['Jules','Yesterday','Good to connect.'],['You','Yesterday','Likewise. Speak soon.']]}
];const list=document.querySelector('#list'),query=document.querySelector('#find'),empty=document.querySelector('.empty'),status=document.querySelector('#status');let filter='all';const drafts=new Map(),controllers=new Map();let active=null;const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;};
for(const chat of data){const article=el('article','conversation');article.dataset.id=chat.id;const row=el('button','row');row.type='button';row.setAttribute('aria-expanded','false');row.setAttribute('aria-controls','workspace-'+chat.id);row.append(el('span','avatar',chat.initial));row.firstChild.setAttribute('aria-hidden','true');const copy=el('span','copy'),line=el('span','name-line'),name=el('span','name',chat.name);if(chat.unread){const badge=el('span','count',chat.unread);badge.setAttribute('aria-label',chat.unread+' unread messages');name.append(badge);}line.append(name,el('span','time',chat.time));copy.append(line);chat.messages.slice(-2).forEach((m,i)=>copy.append(el('span',i?'preview-two':'snippet',m[0]+': '+m[2])));copy.append(el('span','channel',chat.channel));const retained=el('span','retained-draft');retained.hidden=true;copy.append(retained);row.append(copy);const work=el('div','workspace');work.id='workspace-'+chat.id;work.hidden=true;const messages=el('div','messages');messages.tabIndex=0;messages.setAttribute('role','region');messages.setAttribute('aria-label','Messages with '+chat.name);function addMessage(m){const p=el('p','message');p.append(el('small','',m[0]+' · '+m[1]),document.createTextNode(m[2]));messages.append(p);}chat.messages.forEach(addMessage);const audience=el('p','audience',chat.email?'Reply by email · nora@example.com · ordinary email protections':chat.group?'To '+chat.name+' · '+chat.channel:'Only '+chat.name);const input=el('textarea');input.setAttribute('aria-label',chat.email?'Email reply to Nora':'Write to '+chat.name);input.placeholder='Your reply…';const actions=el('div','actions'),close=el('button','close','Close conversation'),send=el('button','send',chat.email?'Send email':'Send');close.type=send.type='button';send.disabled=true;const draft=el('p','draft');actions.append(close,send);work.append(messages,audience,input,actions,draft);article.append(row,work);list.append(article);function open(on,returnFocus=true){if(on&&active&&active!==chat.id)controllers.get(active)(false,false);active=on?chat.id:active===chat.id?null:active;article.classList.toggle('open',on);work.hidden=!on;row.setAttribute('aria-expanded',String(on));if(on){chat.unread=0;row.querySelector('.count')?.remove();}else if(returnFocus)row.focus({preventScroll:true});status.textContent=on?chat.name+' opened in the list. Other conversations stay in place.':chat.name+' closed. Draft retained in this tab.';}controllers.set(chat.id,open);row.addEventListener('click',()=>open(work.hidden));close.addEventListener('click',()=>open(false));input.addEventListener('input',()=>{drafts.set(chat.id,input.value);retained.hidden=!input.value;retained.textContent=input.value?'Draft kept':'';send.disabled=!input.value.trim();draft.textContent=input.value?'Draft retained in this tab · not sent':'';});send.addEventListener('click',()=>{const text=input.value.trim();if(!text)return;chat.messages.push(['You','Now',text]);addMessage(['You','Now',text]);input.value='';drafts.delete(chat.id);retained.hidden=true;send.disabled=true;draft.textContent='Send simulated. Nothing delivered externally.';chat.messages.slice(-2).forEach((m,i)=>copy.querySelector(i?'.preview-two':'.snippet').textContent=m[0]+': '+m[2]);copy.querySelector('.time').textContent='Now';status.textContent='Message send simulated for '+chat.name;});article.addEventListener('keydown',e=>{if(e.key==='Escape'&&!work.hidden){e.stopPropagation();open(false);}});}
function apply(){const q=query.value.trim().toLowerCase();let visible=0;for(const chat of data){const matches=(filter==='all'||filter==='unread'&&chat.unread>0||filter==='groups'&&chat.group)&&(!q||[chat.name,...chat.messages.map(m=>m[2])].join(' ').toLowerCase().includes(q));const article=list.querySelector('[data-id="'+chat.id+'"]');if(!matches&&active===chat.id)controllers.get(chat.id)(false,false);article.hidden=!matches;visible+=matches?1:0;}empty.hidden=visible>0;status.textContent=visible+' conversations shown';}query.addEventListener('input',apply);document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));apply();}));document.querySelector('#appearance').addEventListener('change',e=>document.documentElement.style.colorScheme=e.target.value);})();
</script></body></html>
