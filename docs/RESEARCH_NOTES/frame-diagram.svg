<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 440' role='img' aria-label='The interface proposes; you send, through the client frame' font-family='-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif'>
<rect width='760' height='440' fill='#FFFFFF'/>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#9AA19A'/></marker></defs>
<text x='24' y='32' font-size='15' font-weight='600' fill='#252B24'>The interface proposes; you send, through the client frame</text>
<rect x='24' y='48' width='712' height='368' rx='8' fill='none' stroke='#9AA19A' stroke-width='1.25' />
<text x='40' y='72' font-size='13' font-weight='600' fill='#252B24'>Your conversation, drawn by the client</text>
<rect x='48' y='88' width='664' height='40' rx='8' fill='#F1F3F0' stroke='#9AA19A' stroke-width='1.25' />
<text x='64' y='113' font-size='13' font-weight='400' fill='#252B24'>Sender mark: Harbour Caf&#233;, bundle 3f9a, accepted by 3 of your contacts</text>
<rect x='48' y='148' width='420' height='112' rx='8' fill='none' stroke='#9AA19A' stroke-width='1.25' stroke-dasharray='5 4'/>
<text x='64' y='172' font-size='13' font-weight='600' fill='#252B24'>Interface from the sender</text>
<text x='64' y='190' font-size='11.5' font-weight='400' fill='#5B6361'>Catalog components, or a sealed bundle</text>
<text x='64' y='206' font-size='11.5' font-weight='400' fill='#5B6361'>No network: cannot report back or reveal an address</text>
<text x='64' y='222' font-size='11.5' font-weight='400' fill='#5B6361'>Changes only itself, never the chat around it</text>
<text x='64' y='238' font-size='11.5' font-weight='400' fill='#5B6361'>Pixels are disposable; results arrive as messages</text>
<rect x='492' y='148' width='220' height='72' rx='8' fill='none' stroke='#9AA19A' stroke-width='1.25' />
<text x='508' y='172' font-size='13' font-weight='600' fill='#252B24'>Typed actions only</text>
<text x='508' y='190' font-size='11.5' font-weight='400' fill='#5B6361'>Propose a message</text>
<text x='508' y='206' font-size='11.5' font-weight='400' fill='#5B6361'>Update shared state</text>
<rect x='492' y='244' width='220' height='72' rx='8' fill='#2F6FB3' fill-opacity='0.12' stroke='#2F6FB3' stroke-width='2'/>
<text x='508' y='268' font-size='13' font-weight='600' fill='#252B24'>Review and send</text>
<text x='508' y='286' font-size='11.5' font-weight='400' fill='#252B24'>What leaves, and to whom</text>
<text x='508' y='302' font-size='11.5' font-weight='400' fill='#252B24'>Client material only</text>
<rect x='492' y='340' width='220' height='56' rx='8' fill='none' stroke='#9AA19A' stroke-width='1.25' />
<text x='508' y='364' font-size='13' font-weight='600' fill='#252B24'>Receipt</text>
<text x='508' y='382' font-size='11.5' font-weight='400' fill='#5B6361'>Queued, accepted or failed</text>
<rect x='48' y='340' width='420' height='56' rx='8' fill='none' stroke='#9AA19A' stroke-width='1.25' />
<text x='64' y='364' font-size='13' font-weight='600' fill='#252B24'>Fold back</text>
<text x='64' y='382' font-size='11.5' font-weight='400' fill='#5B6361'>Done returns to the chat with the draft intact</text>
<g fill='none' stroke='#9AA19A' stroke-width='1.25'><path d='M468 184H492' marker-end='url(#a)'/><path d='M602 220V244' marker-end='url(#a)'/><path d='M602 316V340' marker-end='url(#a)'/><path d='M492 368H468' marker-end='url(#a)'/></g>
</svg>