<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">From anatomy to interface — design direction</title><desc id="desc">A white canvas with subtle blue materials, oat email and neutral lettering. Coordination, local action, adaptive space and deliberate visibility connect the octopus analogy to the interface.</desc>
<rect width="1200" height="680" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#252b24"><text x="60" y="70" font-size="14" letter-spacing="2">INDEPENDENT SIMPLEX EXPERIENCE STUDY · 2028 HYPOTHESIS</text><text x="60" y="135" font-size="48">From anatomy to interface</text><text x="60" y="180" font-size="22">Different foundations. A different evolution.</text>
<g font-size="18"><rect x="60" y="225" width="330" height="105" rx="16" fill="#f0f5f9"/><text x="80" y="265">Private messages</text><text x="80" y="300" font-size="15">White reading · ice-blue identity</text><rect x="420" y="225" width="330" height="105" rx="16" fill="#e7eff5"/><text x="440" y="265">Public channels</text><text x="440" y="300" font-size="15">Pale blue · explicit public audience</text><rect x="780" y="225" width="360" height="105" rx="16" fill="#eee3d2"/><text x="800" y="265">External email</text><text x="800" y="300" font-size="15">Warm oat · source stays separate</text></g>
<path d="M80 388H1120" stroke="#7d8271"/>
<g font-size="20"><text x="60" y="440">Coordinate</text><text x="335" y="440">Act locally</text><text x="610" y="440">Unfold</text><text x="885" y="440">Reveal deliberately</text></g>
<g font-size="15"><text x="60" y="478">One relationship index</text><text x="335" y="478">Tools beside their source</text><text x="610" y="478">Space follows attention</text><text x="885" y="478">Review what crosses</text></g>
<rect x="60" y="540" width="255" height="54" rx="27" fill="#8d3e2b"/><text x="87" y="573" fill="#fff7ed" font-size="17">Deliberate action</text><text x="350" y="574" font-size="18">Subtle blue materials. Neutral words. Design has no ego.</text><text x="60" y="637" font-size="13">An analogy expressed through behaviour, not decorative tentacles. Original design material: CC BY 4.0.</text></g></svg>
